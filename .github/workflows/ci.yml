# Runs the automated tests (tests/run.js) on every branch push.
# Also called by deploy.yml so nothing is deployed unless the tests pass.
name: Tests

on:
  push:
    branches-ignore: [Master] # Master is tested by deploy.yml before it deploys
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No package-lock.json in the repo, so npm install (not npm ci)
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
